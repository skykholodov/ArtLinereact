services:
  - type: web
    name: artlinekz
    env: node
    plan: free
    buildCommand: "npm install && npm run build"
    startCommand: "npm run start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: OPENAI_API_KEY
        sync: false   # безопасно хранить в Render dashboard
      - key: DATABASE_URL
        sync: false   # строка подключения к Postgres
      - key: PROVIDER_URL
        sync: false   # RPC (Infura / Alchemy)
      - key: API_KEY
        sync: false   # секретный API ключ
      - key: JWT_SECRET
        sync: false   # для авторизации, если используется
